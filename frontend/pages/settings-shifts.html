
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>シフト設定 | Tasfina</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- シフト設定専用CSS -->
    <link rel="stylesheet" href="../css/settings-shifts.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- シフト設定専用JavaScript -->
    <script src="../js/settings-shifts.js" defer></script>
</head>

<body class="app-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <!-- メインコンテンツ -->
        <main class="main-content settings-shifts-page">

            <!-- ページ見出し -->
            <div class="shift-page-heading">
                <h1>シフト設定</h1>
                <p>
                    繁忙期の設定、シフト種別、負担スコアの設定を管理します。
                </p>
            </div>

            <!-- 設定画面共通ナビゲーション -->
           <!-- 共通設定ナビゲーション -->
<div id="settingsNav"></div>

            <!-- 上部2カラム -->
            <div class="shift-settings-grid">

                <!-- 左カラム -->
                <div class="shift-settings-left">

                    <!-- 繁忙期設定 -->
                    <section class="shift-card">

                        <div class="shift-card-heading">

                            <div>
                                <h2>繁忙期設定</h2>
                                <p>
                                    期間ごとに忙しさのレベルを設定し、
                                    シフトの負担スコアに反映します。
                                </p>
                            </div>

                            <button
                                type="button"
                                id="addBusyPeriodButton"
                                class="btn btn-outline-primary shift-add-button"
                            >
                                <i class="bi bi-plus-lg"></i>
                                繁忙期を追加
                            </button>

                        </div>

                        <div class="table-responsive">

                            <table class="table shift-table">

                                <thead>
                                    <tr>
                                        <th>期間</th>
                                        <th>名称</th>
                                        <th>忙しさレベル</th>
                                        <th>負担スコア補正</th>
                                        <th>説明</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>

                                <tbody id="busyPeriodTableBody"></tbody>

                            </table>

                        </div>

                    </section>

                    <!-- シフト種別設定 -->
                    <section class="shift-card">

                        <div class="shift-card-heading">

                            <div>
                                <h2>シフト種別設定</h2>
                                <p>
                                    シフトの種類と基本時間、負担スコアを設定します。
                                </p>
                            </div>

                            <button
                                type="button"
                                id="addShiftTypeButton"
                                class="btn btn-outline-primary shift-add-button"
                            >
                                <i class="bi bi-plus-lg"></i>
                                シフト種別を追加
                            </button>

                        </div>

                        <div class="table-responsive">

                            <table class="table shift-table">

                                <thead>
                                    <tr>
                                        <th>シフト種別</th>
                                        <th>表示色</th>
                                        <th>勤務時間</th>
                                        <th>休憩時間</th>
                                        <th>負担スコア</th>
                                        <th>説明</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>

                                <tbody id="shiftTypeTableBody"></tbody>

                            </table>

                        </div>

                    </section>

                </div>

                <!-- 右カラム：編集フォーム -->
                <aside class="shift-settings-right">

                    <section class="shift-card shift-editor-card">

                        <h2 id="editorHeading">繁忙期の詳細設定</h2>

                        <!-- 繁忙期編集フォーム -->
                        <form id="busyPeriodForm" novalidate>

                            <div class="shift-form-group">

                                <label for="busyName">
                                    名称 <span class="shift-required">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="busyName"
                                    class="form-control"
                                    maxlength="50"
                                    required
                                >

                                <p class="shift-character-count" id="busyNameCount">
                                    0 / 50
                                </p>

                            </div>

                            <div class="shift-form-group">

                                <label for="busyStartDate">
                                    期間 <span class="shift-required">*</span>
                                </label>

                                <div class="shift-date-range">

                                    <input
                                        type="date"
                                        id="busyStartDate"
                                        class="form-control"
                                        required
                                    >

                                    <span>～</span>

                                    <input
                                        type="date"
                                        id="busyEndDate"
                                        class="form-control"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="shift-form-group">

                                <label for="busyLevel">
                                    忙しさレベル <span class="shift-required">*</span>
                                </label>

                                <select id="busyLevel" class="form-select" required>
                                    <option value="very-high">非常に高い</option>
                                    <option value="high">高い</option>
                                    <option value="medium-high">やや高い</option>
                                    <option value="normal">通常</option>
                                </select>

                            </div>

                            <div class="shift-form-group">

                                <label for="busyScore">
                                    負担スコア補正 <span class="shift-required">*</span>
                                </label>

                                <input
                                    type="number"
                                    id="busyScore"
                                    class="form-control"
                                    min="0"
                                    max="10"
                                    step="0.1"
                                    required
                                >

                                <p class="shift-help">
                                    通常時の負担スコアに加算されます。
                                </p>

                            </div>

                            <div class="shift-form-group">

                                <label for="busyDescription">説明</label>

                                <textarea
                                    id="busyDescription"
                                    class="form-control"
                                    rows="3"
                                    maxlength="300"
                                ></textarea>

                                <p
                                    class="shift-character-count"
                                    id="busyDescriptionCount"
                                >
                                    0 / 300
                                </p>

                            </div>

                            <div class="shift-form-actions">

                                <button
                                    type="button"
                                    id="cancelBusyPeriodButton"
                                    class="btn btn-outline-secondary"
                                >
                                    キャンセル
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>
                                    保存
                                </button>

                            </div>

                        </form>

                        <!-- シフト種別編集フォーム -->
                        <form id="shiftTypeForm" hidden novalidate>

                            <div class="shift-form-group">
                                <label for="shiftTypeName">
                                    シフト種別名 <span class="shift-required">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="shiftTypeName"
                                    class="form-control"
                                    maxlength="50"
                                    required
                                >
                            </div>

                            <div class="shift-form-group">
                                <label for="shiftTypeColor">表示色</label>
                                <input
                                    type="color"
                                    id="shiftTypeColor"
                                    class="form-control form-control-color"
                                    value="#409eff"
                                >
                            </div>

                            <div class="shift-form-group">
                                <label>勤務時間</label>

                                <div class="shift-date-range">
                                    <input
                                        type="time"
                                        id="shiftStartTime"
                                        class="form-control"
                                    >

                                    <span>～</span>

                                    <input
                                        type="time"
                                        id="shiftEndTime"
                                        class="form-control"
                                    >
                                </div>
                            </div>

                            <div class="shift-form-group">
                                <label for="shiftBreakMinutes">休憩時間</label>

                                <select
                                    id="shiftBreakMinutes"
                                    class="form-select"
                                >
                                    <option value="0">なし</option>
                                    <option value="30">30分</option>
                                    <option value="45">45分</option>
                                    <option value="60">1時間</option>
                                    <option value="90">1時間30分</option>
                                </select>
                            </div>

                            <div class="shift-form-group">
                                <label for="shiftTypeScore">
                                    負担スコア <span class="shift-required">*</span>
                                </label>

                                <input
                                    type="number"
                                    id="shiftTypeScore"
                                    class="form-control"
                                    min="0"
                                    max="10"
                                    step="0.1"
                                    required
                                >
                            </div>

                            <div class="shift-form-group">
                                <label for="shiftTypeDescription">説明</label>

                                <textarea
                                    id="shiftTypeDescription"
                                    class="form-control"
                                    rows="3"
                                    maxlength="300"
                                ></textarea>
                            </div>

                            <div class="shift-form-actions">

                                <button
                                    type="button"
                                    id="cancelShiftTypeButton"
                                    class="btn btn-outline-secondary"
                                >
                                    キャンセル
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>
                                    保存
                                </button>

                            </div>

                        </form>

                    </section>

                </aside>

            </div>

            <!-- 自動調整ルール -->
            <section class="shift-card shift-rules-card">

                <div class="shift-card-heading">
                    <div>
                        <h2>自動調整ルール</h2>
                        <p>
                            シフト作成時の自動調整に関するルールを設定します。
                        </p>
                    </div>
                </div>

                <form id="shiftRulesForm" class="shift-rules-form">

                    <div class="shift-rule-field">
                        <label for="maxConsecutiveDays">
                            連続勤務の上限日数
                        </label>

                        <input
                            type="number"
                            id="maxConsecutiveDays"
                            class="form-control"
                            min="1"
                            max="31"
                            value="5"
                            required
                        >

                        <span>日</span>
                    </div>

                    <div class="shift-rule-field">
                        <label for="maxMonthlyDays">
                            月の最大勤務日数
                        </label>

                        <input
                            type="number"
                            id="maxMonthlyDays"
                            class="form-control"
                            min="1"
                            max="31"
                            value="20"
                            required
                        >

                        <span>日</span>
                    </div>

                    <div class="shift-rule-field shift-rule-priority">

                        <label for="requestPriority">
                            希望シフトの優先度
                        </label>

                        <select
                            id="requestPriority"
                            class="form-select"
                        >
                            <option value="high">高</option>
                            <option value="medium">中</option>
                            <option value="low">低</option>
                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary shift-rules-save"
                    >
                        <i class="bi bi-floppy"></i>
                        保存
                    </button>

                </form>

            </section>

            <p
                id="shiftSettingsMessage"
                class="shift-settings-message"
                role="status"
                aria-live="polite"
            ></p>

        </main>

    </div>

</body>
</html>
