<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasfina シフト管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/shifts.css">
    <!-- JavaScript の読み込み -->
    <script src="../js/common.js" defer></script>
    <script src="../js/shifts.js" defer></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <div id="header"></div>
    <!-- 権限切り替え用プルダウン -->
    <div class="p-4 bg-white border-b flex justify-end">
        <select id="roleSelector" class="bg-[#1e3a8a] text-white text-sm font-semibold px-3 py-1 rounded focus:outline-none cursor-pointer">
            <option value="general">一般ユーザー</option>
            <option value="admin">管理者</option>
        </select>
    </div>

   <!-- 共通レイアウト -->
    <div class="app-layout flex flex-1">
        <!-- サイドバー -->
        <div id="sidebar"></div>
        <!-- メインコンテンツ -->
        <main class="flex-1 p-6 overflow-y-auto">
            <!-- ページタイトル & アクションボタン -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">シフト管理</h2>
                
                <div class="flex flex-wrap items-center gap-2">
                    <!-- 月切り替えコントロール -->
                    <div class="flex items-center bg-white border border-gray-300 rounded-md shadow-sm">
                        <button id="prevMonthBtn" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-l-md">&lt;</button>
                        <span id="currentYM" class="px-4 py-1.5 text-sm font-semibold text-gray-700">2026-10</span>
                        <button id="nextMonthBtn" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-r-md">&gt;</button>
                    </div>

                    <!-- 一般用ボタン群 -->
                    <div id="generalActionButtons" class="flex items-center gap-2">
                        <button id="openPreferredModalBtn" class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            希望シフト提出
                        </button>
                        <button class="flex items-center px-4 py-2 bg-white border border-blue-600 text-blue-600 text-sm font-medium rounded-md shadow-sm hover:bg-blue-50">
                            有休申請
                        </button>
                    </div>

                    <!-- 管理者用ボタン群 -->
                    <div id="adminActionButtons" class="hidden flex items-center gap-2">
                        <button id="openBusyModalBtn" class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            繁忙期設定
                        </button>
                    </div>
                </div>
            </div>

            <!-- メインレイアウト（2カラムグリッド） -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左側：カレンダー & 選択日詳細 -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                        <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-500 bg-gray-50 border-b border-gray-200 py-2">
                            <span class="text-red-500">日</span>
                            <span>月</span>
                            <span>火</span>
                            <span>水</span>
                            <span>木</span>
                            <span>金</span>
                            <span class="text-blue-500">土</span>
                        </div>
                        <!-- カレンダーの日付グリッド（JSで動的埋め込み対応） -->
                        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-gray-200 text-sm min-h-[400px]">
                            <!-- 動的に生成されます -->
                        </div>
                    </div>

                    <!-- 選択日の詳細情報 -->
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5">
                        <h3 class="text-md font-bold text-gray-800 mb-3">選択日の詳細情報</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2 text-sm">
                                <div id="selectedDateText" class="font-semibold text-gray-700">日付を選択してください</div>
                                <div class="flex justify-between py-1 border-b border-gray-100">
                                    <span class="text-gray-500">シフト種別</span>
                                    <span id="detailShiftType" class="px-2 py-0.5 bg-gray-100 text-gray-600 font-medium rounded text-xs">ー</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-gray-100">
                                    <span class="text-gray-500">勤務時間</span>
                                    <span id="detailTime" class="font-medium text-gray-800">ー</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">メモ</label>
                                <textarea id="detailMemo" class="w-full h-24 p-2 text-sm border border-gray-300 rounded-md resize-none" placeholder="メモを入力してください"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右側：本日のシフト・集計・申請状況 -->
                <div class="space-y-6">
                    <!-- 本日のシフト -->
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-sm font-bold text-gray-800">本日のシフト</h3>
                            <span id="todayDateLabel" class="text-xs text-gray-400"></span>
                        </div>
                        <div id="todaysShiftCard" class="p-3 bg-gray-50 border border-gray-200 rounded-md">
                            <div class="text-sm font-bold text-gray-700">シフト情報なし</div>
                        </div>
                    </div>

                    <!-- シフト集計 -->
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <h3 class="text-sm font-bold text-gray-800 mb-3">シフト集計（今月）</h3>
                        <div id="shiftSummaryList" class="space-y-2 text-xs">
                            <!-- 動的集計結果 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- モーダル：希望シフト提出 -->
    <div id="preferredModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">希望シフト提出</h3>
                <button id="closePreferredModalBtn" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">対象日</label>
                    <input type="date" id="prefDate" class="w-full p-2 border border-gray-300 rounded text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">開始時間</label>
                        <input type="time" id="prefStartTime" value="09:00" class="w-full p-2 border border-gray-300 rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">終了時間</label>
                        <input type="time" id="prefEndTime" value="18:00" class="w-full p-2 border border-gray-300 rounded text-sm">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 border-t pt-3">
                <button id="cancelPreferredModalBtn" class="px-4 py-1.5 border border-gray-300 text-gray-700 text-xs font-medium rounded">キャンセル</button>
                <button id="submitPreferredModalBtn" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-medium rounded hover:bg-blue-700">提出する</button>
            </div>
        </div>
    </div>

    <!-- モーダル：繁忙期設定 -->
    <div id="busyModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-md font-bold text-gray-800">繁忙期設定</h3>
                <button id="closeBusyModalBtn" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">対象日</label>
                    <input type="date" id="busyDate" class="w-full p-2 border border-gray-300 rounded">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">必要人数</label>
                    <input type="number" id="busyRequiredPeople" value="5" class="w-full p-2 border border-gray-300 rounded">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">加算ポイント</label>
                    <select id="busyBonusPt" class="w-full p-2 border border-gray-300 rounded bg-white">
                        <option value="2.0">2.0 pt</option>
                        <option value="1.5">1.5 pt</option>
                        <option value="1.0">1.0 pt</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 border-t pt-3">
                <button id="cancelBusyModalBtn" class="px-4 py-1.5 border border-gray-300 text-gray-700 text-xs font-medium rounded">キャンセル</button>
                <button id="submitBusyModalBtn" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-medium rounded hover:bg-blue-700">登録する</button>
            </div>
        </div>
    </div>
</body>
</html>
