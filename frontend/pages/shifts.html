<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasfina シフト管理</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/shifts.css">
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/shifts.js" defer></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <div id="header"></div>
    <div class="p-4 bg-white border-b flex justify-end">
        <select id="roleSelector" class="bg-[#1e3a8a] text-white text-sm font-semibold px-3 py-1 rounded focus:outline-none cursor-pointer">
            <option value="general">一般ユーザー</option>
            <option value="admin">管理者</option>
        </select>
    </div>

    <div class="app-layout flex flex-1">
        <div id="sidebar"></div>
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">シフト管理</h2>
                
                <div class="flex flex-wrap items-center gap-2">
                    <!-- 月切り替えコントロール -->
                    <div class="flex items-center bg-white border border-gray-300 rounded-md shadow-sm">
                        <button id="prevMonthBtn" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-l-md">&lt;</button>
                        <span id="currentYM" class="px-4 py-1.5 text-sm font-semibold text-gray-700">2024-10</span>
                        <button id="nextMonthBtn" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-r-md">&gt;</button>
                    </div>

                    <!-- 一般用ボタン群 -->
                    <div id="generalActionButtons" class="flex items-center gap-2">
                        <button id="openPreferredModalBtn" class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            希望シフト提出
                        </button>
                        <button id="openPaidLeaveBtn" class="flex items-center px-4 py-2 bg-white border border-blue-600 text-blue-600 text-sm font-medium rounded-md shadow-sm hover:bg-blue-50">
                            有休申請
                        </button>
                        <button class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            シフト確定
                        </button>
                        <button id="openRouletteModalBtn" class="flex items-center px-4 py-2 bg-white border border-blue-600 text-blue-600 text-sm font-medium rounded-md shadow-sm hover:bg-blue-50">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                             </svg>
                        シフトルーレット
                        </button>
                    </div>

                    <!-- 管理者用ボタン群 -->
                    <div id="adminActionButtons" class="hidden flex items-center gap-2">
                        <button class="flex items-center px-4 py-2 bg-white border border-blue-600 text-blue-600 text-sm font-medium rounded-md shadow-sm hover:bg-blue-50">
                            希望シフト提出の締め切り設定
                        </button>
                        <button id="openBusyModalBtn" class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            繁忙期設定
                        </button>
                        <button class="flex items-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md shadow-sm hover:bg-blue-700">
                            シフト確定
                        </button>
                        <button class="openRouletteModalBtn flex items-center px-4 py-2 bg-white border border-blue-600 text-blue-600 text-sm font-medium rounded-md shadow-sm hover:bg-blue-50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            シフトルーレット
                        </button>
                    </div>
                </div>
            </div>

            <!-- メインレイアウト -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：カレンダー & 選択日詳細 -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                        <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-500 bg-gray-50 border-b border-gray-200 py-2">
                            <span class="text-red-500">日</span>
                            <span>月</span>
                            <span>火</span>
                            <span>水</span>
                            <span>木</span>
                            <span>金</span>
                            <span class="text-blue-500">土</span>
                        </div>
                        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-gray-200 text-sm min-h-[450px]">
                            <!-- JSで生成されます -->
                        </div>
                        <div class="px-4 py-3 bg-gray-50 border-t border-gray-200 flex flex-wrap items-center gap-4 text-xs">
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-blue-100 border border-blue-300 rounded"></span>通常出勤</span>
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-green-100 border border-green-300 rounded"></span>在宅勤務</span>
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-orange-100 border border-orange-300 rounded"></span>午前休</span>
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-red-100 border border-red-300 rounded"></span>休日</span>
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 bg-pink-100 border border-pink-300 rounded"></span>繁忙日 (+2.0pt)</span>
                        </div>
                    </div>

                    <!-- 選択日の詳細情報 -->
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5">
                        <h3 class="text-md font-bold text-gray-800 mb-3">選択日の詳細情報</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2 text-sm">
                                <div id="selectedDateText" class="font-semibold text-gray-700">日付を選択してください</div>
                                <div class="flex justify-between py-1 border-b border-gray-100">
                                    <span class="text-gray-500">シフト種別</span>
                                    <span id="detailShiftType" class="px-2 py-0.5 bg-gray-100 text-gray-600 font-medium rounded text-xs">ー</span>
                                </div>
                                <div class="flex justify-between py-1 border-b border-gray-100">
                                    <span class="text-gray-500">勤務時間</span>
                                    <span id="detailTime" class="font-medium text-gray-800">ー</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">メモ</label>
                                <textarea id="detailMemo" class="w-full h-24 p-2 text-sm border border-gray-300 rounded-md resize-none" placeholder="メモを入力してください"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右側：本日のシフト・集計 -->
                <div class="space-y-6">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-sm font-bold text-gray-800">本日のシフト</h3>
                            <span id="todayDateLabel" class="text-xs text-gray-400"></span>
                        </div>
                        <div id="todaysShiftCard" class="p-3 bg-gray-50 border border-gray-200 rounded-md">
                            <div class="text-sm font-bold text-gray-700">シフト情報なし</div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <h3 class="text-sm font-bold text-gray-800 mb-3">シフト集計（今月）</h3>
                        <div id="shiftSummaryList" class="space-y-2 text-xs">
                            <!-- 動的集計結果 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- モーダル群の定義（追加部分）                   -->
    <!-- ========================================== -->

    <!-- 希望シフト提出モーダル -->
    <div id="preferredModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">希望シフト提出</h3>
                <button id="closePreferredModalBtn" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">対象日</label>
                    <input type="date" id="prefDate" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">シフト種別</label>
                    <select id="prefStatus" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                        <option value="通常出勤">通常出勤</option>
                        <option value="在宅勤務">在宅勤務</option>
                        <option value="午前休">午前休</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">開始時間</label>
                        <input type="time" id="prefStartTime" value="09:00" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">終了時間</label>
                        <input type="time" id="prefEndTime" value="18:00" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="cancelPreferredModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300">キャンセル</button>
                <button id="submitPreferredModalBtn" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">登録する</button>
            </div>
        </div>
    </div>

    <!-- 有休申請モーダル -->
    <div id="paidLeaveModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">有休申請</h3>
                <button id="closePaidLeaveModalBtn" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">開始日</label>
                        <input type="date" id="leaveStartDate" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">終了日</label>
                        <input type="date" id="leaveEndDate" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">取得区分</label>
                    <div class="flex gap-4 text-sm mt-1">
                        <label><input type="radio" name="leaveType" value="full" checked class="mr-1"> 全日</label>
                        <label><input type="radio" name="leaveType" value="half_am" class="mr-1"> 午前休</label>
                        <label><input type="radio" name="leaveType" value="half_pm" class="mr-1"> 午後休</label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">取得理由</label>
                    <textarea id="leaveReason" class="w-full h-20 p-2 text-sm border border-gray-300 rounded-md resize-none" placeholder="理由を入力してください"></textarea>
                    <div id="charCount" class="text-right text-xs text-gray-400 mt-1">0 / 300</div>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="cancelPaidLeaveModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300">キャンセル</button>
                <button id="submitPaidLeaveModalBtn" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">申請する</button>
            </div>
        </div>
    </div>

    <!-- 繁忙期設定モーダル -->
    <div id="busyModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">繁忙期設定</h3>
                <button id="closeBusyModalBtn" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">対象日</label>
                    <input type="date" id="busyDate" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">必要人数</label>
                    <input type="number" id="busyRequiredPeople" value="5" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">ボーナスポイント</label>
                    <input type="number" step="0.1" id="busyBonusPt" value="2.0" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="cancelBusyModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300">キャンセル</button>
                <button id="submitBusyModalBtn" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">保存する</button>
            </div>
        </div>
    </div>

    <!-- シフトルーレットモーダル -->
    <div id="rouletteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">シフトルーレット</h3>
                <button id="closeRouletteModalBtn" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">対象日</label>
                    <input type="date" id="rouletteDate" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">割り当てシフト</label>
                    <select id="rouletteShiftType" class="w-full p-2 text-sm border border-gray-300 rounded-md">
                        <option value="在宅勤務">在宅勤務</option>
                        <option value="通常出勤">通常出勤</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="cancelRouletteModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300">キャンセル</button>
                <button id="executeRouletteBtn" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700">ルーレット実行</button>
            </div>
        </div>
    </div>

</body>
</html>
