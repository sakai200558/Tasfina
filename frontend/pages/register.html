
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>新規登録 | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- 新規登録専用CSS -->
    <link rel="stylesheet" href="../css/register.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- 新規登録専用JavaScript -->
    <script src="../js/register.js" defer></script>
</head>

<body class="register-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <!-- 新規登録画面 -->
    <main class="register-main">

        <section class="register-container">

            <h1 class="register-title">新規登録</h1>

            <form id="registerForm" novalidate>

                <!-- ユーザー名 -->
                <div class="register-form-group">

                    <label for="username">
                        ユーザー名
                        <span class="required-mark">※</span>
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="例：山田太郎"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                </div>

                <!-- メールアドレス -->
                <div class="register-form-group">

                    <label for="email">
                        メールアドレス
                        <span class="required-mark">※</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- パスワード -->
                <div class="register-form-group">

                    <label for="password">
                        パスワード
                        <span class="required-mark">※</span>
                    </label>

                    <div class="register-password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="半角英数字8文字以上"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="register-password-toggle"
                            data-target="password"
                            aria-label="パスワードを表示"
                            aria-pressed="false"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- パスワード確認 -->
                <div class="register-form-group">

                    <label for="passwordConfirm">
                        パスワード確認用
                        <span class="required-mark">※</span>
                    </label>

                    <div class="register-password-wrapper">

                        <input
                            type="password"
                            id="passwordConfirm"
                            name="passwordConfirm"
                            placeholder="もう一度入力してください"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="register-password-toggle"
                            data-target="passwordConfirm"
                            aria-label="確認用パスワードを表示"
                            aria-pressed="false"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- 全体グループID／部門コード -->
                <div class="register-form-group">

                    <label for="deptCode">
                        全体グループID／部門コード
                    </label>

                    <input
                        type="text"
                        id="deptCode"
                        name="deptCode"
                        placeholder="招待されたコードを入力"
                    >

                </div>

                <!-- 特別コード -->
                <div class="register-form-group">

                    <label for="specialCode">
                        権限コード
                    </label>

                    <input
                        type="password"
                        id="specialCode"
                        name="specialCode"
                        placeholder="コードをお持ちの場合"
                        autocomplete="off"
                    >

                </div>

                <!-- エラー表示 -->
                <p
                    id="registerError"
                    class="register-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <!-- 新規登録ボタン -->
                <button
                    type="submit"
                    id="registerButton"
                    class="register-submit-button"
                >
                    新規アカウント登録
                </button>

            </form>

            <!-- ログイン画面へ戻る -->
            <div class="register-login-area">

                <p>既にアカウントをお持ちの方</p>

                <a href="login.html">
                    ログイン画面へ戻る
                </a>

            </div>

        </section>

    </main>

</body>
</html>
