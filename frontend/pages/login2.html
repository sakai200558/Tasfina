
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- ログイン専用CSS -->
    <link rel="stylesheet" href="../css/login.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- ログイン専用JavaScript -->
    <script src="../js/login2.js" defer></script>

</head>

<body class="login-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <!-- ログイン画面 -->
    <main class="login-main">

        <section class="login-container">

            <h1 class="login-title">ログイン</h1>

            <!-- ログインフォーム -->
            <form id="loginForm" novalidate>

                <!-- メールアドレス -->
                <div class="login-form-group mb-4">

                    <label
                        for="email"
                        class="form-label"
                    >
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        autocomplete="username"
                        placeholder="example@email.com"
                        required
                    >

                    <div class="invalid-feedback">
                        正しいメールアドレスを入力してください。
                    </div>

                </div>

                <!-- パスワード -->
                <div class="login-form-group mb-4">

                    <label
                        for="password"
                        class="form-label"
                    >
                        パスワード
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            autocomplete="current-password"
                            placeholder="パスワードを入力"
                            required
                        >

                        <!-- パスワード表示切り替え -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="パスワードを表示"
                            aria-pressed="false"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div
                        id="passwordFeedback"
                        class="invalid-feedback"
                    >
                        パスワードを入力してください。
                    </div>

                </div>

                <!-- エラーメッセージ -->
                <p
                    id="loginError"
                    class="login-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <!-- ログインボタン -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button btn btn-primary"
                >
                    ログイン
                </button>

            </form>

            <!-- パスワード再設定 -->
            <a
                href="forgot-password.html"
                class="forgot-password"
            >
                パスワードを忘れた場合
            </a>

            <!-- 新規登録 -->
            <div class="register-area">

                <p>アカウントをお持ちでない方</p>

                <a
                    href="register.html"
                    class="register-button"
                >
                    新規登録はこちら
                </a>

            </div>

        </section>

    </main>

</body>
</html>
