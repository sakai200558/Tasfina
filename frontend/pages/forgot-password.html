
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>パスワード再設定 | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- パスワード再設定専用CSS -->
    <link rel="stylesheet" href="../css/forgot-password.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- パスワード再設定専用JavaScript -->
    <script src="../js/forgot-password.js" defer></script>
</head>

<body class="forgot-password-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <!-- メインコンテンツ -->
    <main class="forgot-password-main">

        <section
            class="forgot-password-container"
            aria-labelledby="forgotPasswordTitle"
        >

            <!-- アイコン -->
            <div class="forgot-password-icon">
                <i class="bi bi-shield-lock"></i>
            </div>

            <!-- タイトル -->
            <h1
                id="forgotPasswordTitle"
                class="forgot-password-title"
            >
                パスワードをお忘れですか？
            </h1>

            <!-- 説明文 -->
            <p class="forgot-password-description">
                ご登録のメールアドレスを入力してください。<br>
                パスワード再設定用のリンクをお送りします。
            </p>

            <!-- 入力フォーム -->
            <form id="forgotPasswordForm" novalidate>

                <div class="forgot-password-form-group">

                    <label for="email">
                        メールアドレス
                        <span class="required-mark">※</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >

                </div>

                <!-- エラーメッセージ -->
                <p
                    id="forgotPasswordError"
                    class="forgot-password-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <!-- 成功メッセージ -->
                <div
                    id="forgotPasswordSuccess"
                    class="forgot-password-success"
                    role="status"
                    aria-live="polite"
                    hidden
                >
                    <i class="bi bi-check-circle-fill"></i>

                    <div>
                        <strong>送信を受け付けました</strong>
                        <p id="forgotPasswordSuccessText">
                            入力されたメールアドレスに対応するアカウントがある場合、
                            パスワード再設定用のメールをお送りします。
                        </p>
                    </div>
                </div>

                <!-- 送信ボタン -->
                <button
                    type="submit"
                    id="forgotPasswordButton"
                    class="forgot-password-submit-button"
                >
                    <i class="bi bi-envelope"></i>
                    <span id="forgotPasswordButtonText">
                        再設定用メールを送信
                    </span>
                </button>

            </form>

            <!-- ログイン画面に戻る -->
            <div class="forgot-password-login-area">

                <a href="login.html">
                    <i class="bi bi-arrow-left"></i>
                    ログイン画面へ戻る
                </a>

            </div>

        </section>

    </main>

</body>

</html>
