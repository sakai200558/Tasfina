
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>タスク管理 | Tasfina</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/tasks.css">
    <link rel="stylesheet" href="../css/task-create.css">

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <!-- 共通・既存JS -->
    <script src="../js/common.js" defer></script>
    <script src="../js/tasks.js" defer></script>
    <script src="../js/task-create.js" defer></script>
   

    
</head>

<body class="app-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <main class="main-content tasks-page">

            <!-- ページ見出し -->
            <div class="task-page-heading">

                <h1>タスク管理</h1>

                <button
                    type="button"
                    id="openTaskCreateModal"
                    class="btn task-create-button"
                >
                    <i class="bi bi-plus-lg"></i>
                    新規タスク作成
                </button>

            </div>

            <!-- 集計カード -->
            <section class="task-summary" aria-label="タスク概要">

                <article class="task-summary-card">
                    <p>進行中</p>
                    <strong id="progressCount">0件</strong>
                </article>

                <article class="task-summary-card">
                    <p>承認待ち</p>
                    <strong id="pendingCount">0件</strong>
                </article>

                <article class="task-summary-card">
                    <p>完了</p>
                    <strong id="doneCount">0件</strong>
                </article>

            </section>

            <!-- タスク一覧 -->
            <section class="task-panel">

                <!-- タブ -->
                <div
                    class="task-tabs"
                    role="tablist"
                    aria-label="タスク分類"
                >

                    <button
                        type="button"
                        class="task-tab active"
                        data-tab="mine"
                        role="tab"
                        aria-selected="true"
                    >
                        自分のタスク
                    </button>

                    <button
                        type="button"
                        class="task-tab"
                        data-tab="others"
                        role="tab"
                        aria-selected="false"
                    >
                        他メンバー
                    </button>

                    <button
                        type="button"
                        class="task-tab"
                        data-tab="requested"
                        role="tab"
                        aria-selected="false"
                    >
                        依頼タスク
                    </button>

                    <button
                        type="button"
                        class="task-tab"
                        data-tab="pending"
                        role="tab"
                        aria-selected="false"
                    >
                        承認待ち
                    </button>

                    <!-- ★ ここにあった「完了済み」の <button>...</button> を削除して保存 -->

                </div>


                <!-- 検索・絞り込み -->
                <div class="task-filters">

                    <div class="task-search">
                        <i class="bi bi-search"></i>

                        <input
                            type="search"
                            id="taskSearch"
                            placeholder="タスク名で検索"
                            aria-label="タスク名で検索"
                        >
                    </div>

                    <select
                        id="assigneeFilter"
                        class="form-select"
                        aria-label="担当者で絞り込み"
                    >
                        <option value="">担当者：全員</option>
                    </select>

                </div>

                <!-- タスクテーブル -->
                <div class="table-responsive">

                    <table class="table task-table">

                        <thead>
                            <tr>
                                <th>タスク名</th>
                                <th>担当者</th>
                                <th>期限</th>
                                <th>状態</th>
                            </tr>
                        </thead>

                        <!-- tasks.js がデータを表示 -->
                        <tbody id="taskTableBody"></tbody>

                    </table>

                </div>

                <!-- 一覧下部 -->
                <div class="task-panel-footer">

                    <span id="taskResultCount"></span>

                    <a href="gantt.html">
                        詳細を見る
                        <i class="bi bi-arrow-right"></i>
                    </a>

                </div>

            </section>

            <!-- 選択中のタスク詳細 -->
            <section class="task-detail-panel">

                <h2>選択中のタスク詳細</h2>

                <!-- tasks.js が詳細を表示 -->
                <div id="selectedTaskDetail">
                    <p class="task-empty">
                        タスクを選択してください。
                    </p>
                </div>

                <div class="task-detail-actions">

                    <button
                        type="button"
                        id="requestHoursButton"
                        class="btn btn-outline-secondary"
                        disabled
                    >
                        工数変更申請
                    </button>

                    <button
                        type="button"
                        id="requestCompleteButton"
                        class="btn btn-primary"
                        disabled
                    >
                        完了申請
                    </button>
                     <!-- ★ このボタンを追加してください -->
                    <button
                        type="button"
                        id="approveTaskButton"
                        class="btn btn-success"
                        style="display: none;"
                    >
                        承認する（ポイント付与）
                    </button>
                    <!-- ★ ここから追加（差し戻しボタン） -->
                    <button
                        type="button"
                        id="rejectTaskButton"
                        class="btn btn-outline-danger ms-2"
                        style="display: none;"
                    >
                        差し戻し（却下）
                    </button>

                </div>

            </section>

        </main>

    </div>

   <!-- 工数変更申請モーダル -->
    <div
        class="modal fade"
        id="workHoursModal"
        tabindex="-1"
        aria-labelledby="workHoursModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content task-modal">

                <form id="workHoursForm">

                    <div class="modal-header">

                        <h2
                            class="modal-title fs-5"
                            id="workHoursModalLabel"
                        >
                            <i class="bi bi-clock-history"></i>
                            工数変更申請
                        </h2>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <p
                            class="modal-task-name"
                            id="hoursTaskName"
                        ></p>

                        <div class="mb-3">
                            <label for="currentHours" class="form-label">
                                現在の想定工数
                            </label>

                            <input
                                type="number"
                                id="currentHours"
                                class="form-control"
                                readonly
                            >
                        </div>

                        <div class="mb-3">
                            <label for="requestedHours" class="form-label">
                                変更後の想定工数（時間）
                            </label>

                            <input
                                type="number"
                                id="requestedHours"
                                class="form-control"
                                min="0.1"
                                step="0.1"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="editPriority" class="form-label">
                                優先度
                            </label>

                            <select id="editPriority" class="form-select">
                                <option value="low">低</option>
                                <option value="medium">中</option>
                                <option value="high">高</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editDifficulty" class="form-label">
                                難易度
                            </label>

                            <select id="editDifficulty" class="form-select">
                                <option value="1">1 (低)</option>
                                <option value="2">2</option>
                                <option value="3">3 (中)</option>
                                <option value="4">4</option>
                                <option value="5">5 (高)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editDiscomfort" class="form-label">
                                不快度（精神的負担）
                            </label>

                            <select id="editDiscomfort" class="form-select">
                                <option value="1">1 (低)</option>
                                <option value="2">2</option>
                                <option value="3">3 (中)</option>
                                <option value="4">4</option>
                                <option value="5">5 (高)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editStartDate" class="form-label">
                                開始日
                            </label>

                            <input
                                type="date"
                                id="editStartDate"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="editDueDate" class="form-label">
                                期限
                            </label>

                            <input
                                type="date"
                                id="editDueDate"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="hoursReason" class="form-label">
                                変更理由
                            </label>

                            <textarea
                                id="hoursReason"
                                class="form-control"
                                rows="4"
                                maxlength="500"
                                required
                            ></textarea>
                        </div>

                        <p
                            id="hoursError"
                            class="form-error"
                            role="alert"
                        ></p>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            キャンセル
                        </button>

                        <button type="submit" class="btn btn-primary">
                            申請する
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>


    <!-- タスク完了申請モーダル -->
    <div
        class="modal fade"
        id="taskCompleteModal"
        tabindex="-1"
        aria-labelledby="taskCompleteModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content task-modal">

                <form id="taskCompleteForm">

                    <div class="modal-header">

                        <h2
                            class="modal-title fs-5"
                            id="taskCompleteModalLabel"
                        >
                            <i class="bi bi-check-circle"></i>
                            タスク完了申請
                        </h2>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <p
                            class="modal-task-name"
                            id="completeTaskName"
                        ></p>




                        <div class="mb-3">
                            <label for="completeReport" class="form-label">
                                完了報告
                            </label>

                            <textarea
                                id="completeReport"
                                class="form-control"
                                rows="4"
                                maxlength="1000"
                                required
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="completeEvidence" class="form-label">
                                エビデンス（任意）
                            </label>

                            <input
                                type="file"
                                id="completeEvidence"
                                class="form-control"
                                accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx"
                            >

                            <div class="form-text">
                                PDF・画像・Word・Excel（最大5MB）
                            </div>
                        </div>

                        <p
                            id="completeError"
                            class="form-error"
                            role="alert"
                        ></p>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            キャンセル
                        </button>

                        <button type="submit" class="btn btn-primary">
                            完了申請する
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>

    <!-- 新規タスク作成モーダル -->
    <div
        class="modal fade"
        id="taskCreateModal"
        tabindex="-1"
        aria-labelledby="taskCreateModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content task-modal">
                <form id="taskCreateForm">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="taskCreateModalLabel">
                            <i class="bi bi-plus-lg"></i>
                            新規タスク作成
                        </h2>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">タスク名 <span class="badge bg-danger">必須</span></label>
                            <input type="text" id="taskTitle" class="form-control" placeholder="例：ログイン機能の開発" required>
                            <div id="titleError" class="form-error"></div>
                        </div>

                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">タスクの説明</label>
                            <textarea id="taskDescription" class="form-control" rows="3" placeholder="タスクの目的や作業内容を入力してください。"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="assignee" class="form-label">担当者 <span class="badge bg-danger">必須</span></label>
                            <select id="assignee" class="form-select" required>
                                <option value="">担当者を選択してください</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="priority" class="form-label">優先度</label>
                            <select id="priority" class="form-select">
                                <option value="1.0">低</option>
                                <option value="2.0" selected>中</option>
                                <option value="3.0">高</option>
                            </select>
                        </div>
                        <!-- 難易度 -->
<div class="mb-3">
    <label for="difficultyLevel" class="form-label">難易度</label>
    <select class="form-select" id="difficultyLevel">
        <option value="1.0">1 (低)</option>
        <option value="2.0">2</option>
        <option value="3.0" selected>3 (中)</option>
        <option value="4.0">4</option>
        <option value="5.0">5 (高)</option>
    </select>
</div>

<!-- 不快度 -->
<div class="mb-3">
    <label for="discomfortLevel" class="form-label">不快度（精神的負担）</label>
    <select class="form-select" id="discomfortLevel">
        <option value="1.0">1 (低)</option>
        <option value="2.0">2</option>
        <option value="3.0" selected>3 (中)</option>
        <option value="4.0">4</option>
        <option value="5.0">5 (高)</option>
    </select>
</div>

                        <div class="mb-3">
                            <label for="startDate" class="form-label">開始日 <span class="badge bg-danger">必須</span></label>
                            <input type="date" id="startDate" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="dueDate" class="form-label">期限 <span class="badge bg-danger">必須</span></label>
                            <input type="date" id="dueDate" class="form-control" required>
                        </div>

                        <p id="formMessage" class="form-error" role="alert"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary">タスクを作成</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 通知表示 -->
    <div
        id="toastArea"
        class="toast-area"
        aria-live="polite"
    ></div>

</body>
</html>
