
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>部門追加 | Tasfina</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- 部門追加専用CSS -->
    <link rel="stylesheet" href="../css/groups-new.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- 部門追加専用JavaScript -->
    <script src="../js/groups-new.js" defer></script>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドメニュー -->
        <div id="sidebar"></div>

        <!-- メインコンテンツ -->
        <main class="main-content groups-main">

            <!-- ページ見出し -->
            <div class="groups-page-heading">

                <h1>部門追加</h1>

                <p>
                    新しい部門を作成し、組織に追加します。
                </p>

            </div>

            <!-- 部門追加フォーム -->
            <div class="groups-layout">

                <section class="groups-panel groups-form-panel">

                    <form id="departmentForm">

                        <!-- =========================
                             基本情報
                        ========================== -->

                        <h2 class="groups-section-title">
                            基本情報
                        </h2>

                        <!-- 部門名 -->
                        <div class="groups-field">

                            <label for="departmentName">
                                部門名
                                <span class="required">*</span>
                            </label>

                            <div class="groups-input-area">

                                <input
                                    type="text"
                                    id="departmentName"
                                    class="form-control"
                                    placeholder="部門名を入力してください（例：営業部）"
                                    maxlength="50"
                                    required
                                >

                                <div class="character-count">
                                    <span id="nameCount">0</span> / 50
                                </div>

                            </div>

                        </div>

                        <!-- 上位部門 -->
                        <div class="groups-field">

                            <label for="parentDepartment">
                                上位部門
                                <span class="required">*</span>
                            </label>

                            <select
                                id="parentDepartment"
                                class="form-select"
                                required
                            >

                                <option value="root">
                                    なし（最上位の部門として作成）
                                </option>

                                <option value="sales">
                                    営業部
                                </option>

                                <option value="development">
                                    開発部
                                </option>

                                <option value="support">
                                    サポート部
                                </option>

                            </select>

                        </div>

                        <!-- 部門の説明 -->
                        <div class="groups-field">

                            <label for="departmentDescription">
                                部門の説明
                            </label>

                            <div class="groups-input-area">

                                <textarea
                                    id="departmentDescription"
                                    class="form-control"
                                    placeholder="部門の説明を入力してください"
                                    maxlength="300"
                                    rows="4"
                                ></textarea>

                                <div class="character-count">
                                    <span id="descriptionCount">0</span> / 300
                                </div>

                            </div>

                        </div>

                        <!-- =========================
                             部門設定
                        ========================== -->

                        <h2 class="groups-section-title">
                            部門設定
                        </h2>

                        <!-- 部門カラー -->
                        <div class="groups-field">

                            <span class="groups-field-label">
                                部門カラー
                                <span class="required">*</span>
                            </span>

                            <div
                                class="color-options"
                                id="colorOptions"
                                role="radiogroup"
                                aria-label="部門カラー"
                            >

                                <!-- 青 -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="blue"
                                        aria-label="青"
                                        checked
                                    >

                                    <span class="color-swatch swatch-blue">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- 緑 -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="green"
                                        aria-label="緑"
                                    >

                                    <span class="color-swatch swatch-green">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- 黄 -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="yellow"
                                        aria-label="黄"
                                    >

                                    <span class="color-swatch swatch-yellow">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- オレンジ -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="orange"
                                        aria-label="オレンジ"
                                    >

                                    <span class="color-swatch swatch-orange">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- 赤 -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="red"
                                        aria-label="赤"
                                    >

                                    <span class="color-swatch swatch-red">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- 紫 -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="purple"
                                        aria-label="紫"
                                    >

                                    <span class="color-swatch swatch-purple">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                                <!-- グレー -->
                                <label class="color-choice">

                                    <input
                                        type="radio"
                                        name="departmentColor"
                                        value="gray"
                                        aria-label="グレー"
                                    >

                                    <span class="color-swatch swatch-gray">
                                        <i class="bi bi-check-lg"></i>
                                    </span>

                                </label>

                            </div>

                        </div>

                        <!-- 部門アイコン -->
                        <div class="groups-field">

                            <label for="departmentIcon">
                                部門アイコン
                            </label>

                            <select
                                id="departmentIcon"
                                class="form-select"
                            >

                                <option value="bi-building">
                                    ビル（デフォルト）
                                </option>

                                <option value="bi-people-fill">
                                    チーム
                                </option>

                                <option value="bi-laptop">
                                    パソコン
                                </option>

                                <option value="bi-headset">
                                    サポート
                                </option>

                                <option value="bi-briefcase-fill">
                                    ビジネス
                                </option>

                                <option value="bi-gear-fill">
                                    管理
                                </option>

                            </select>

                        </div>

                        <!-- =========================
                             部門管理者
                        ========================== -->

                        <h2 class="groups-section-title">
                            部門管理者
                        </h2>

                        <!-- 管理者の選択 -->
                        <div class="groups-field">

                            <label for="departmentManager">
                                管理者の選択
                            </label>

                            <div class="groups-input-area">

                                <select
                                    id="departmentManager"
                                    class="form-select"
                                >

                                    <option value="">
                                        選択してください
                                    </option>

                                    <option value="田中 美咲">
                                        田中 美咲
                                    </option>

                                    <option value="佐藤 花子">
                                        佐藤 花子
                                    </option>

                                    <option value="伊藤 翔">
                                        伊藤 翔
                                    </option>

                                    <option value="高橋 健">
                                        高橋 健
                                    </option>

                                </select>

                                <p class="groups-help">
                                    ※ 後から変更することも可能です。
                                </p>

                            </div>

                        </div>

                        <!-- メンバーの追加 -->
                        <div class="groups-field groups-members-field">

                            <label for="memberSearch">
                                メンバーの追加
                            </label>

                            <div class="groups-input-area">

                                <!-- 検索 -->
                                <div class="member-search-wrapper">

                                    <i class="bi bi-search"></i>

                                    <input
                                        type="search"
                                        id="memberSearch"
                                        class="form-control"
                                        placeholder="メンバー名で検索"
                                    >

                                </div>

                                <!-- メンバー一覧 -->
                                <div
                                    class="member-list"
                                    id="memberList"
                                >

                                    <label class="member-option">

                                        <input
                                            type="checkbox"
                                            value="田中 美咲"
                                        >

                                        <span>
                                            田中 美咲（営業部）
                                        </span>

                                    </label>

                                    <label class="member-option">

                                        <input
                                            type="checkbox"
                                            value="佐藤 花子"
                                        >

                                        <span>
                                            佐藤 花子（開発部）
                                        </span>

                                    </label>

                                    <label class="member-option">

                                        <input
                                            type="checkbox"
                                            value="伊藤 翔"
                                        >

                                        <span>
                                            伊藤 翔（開発部）
                                        </span>

                                    </label>

                                    <label class="member-option">

                                        <input
                                            type="checkbox"
                                            value="高橋 健"
                                        >

                                        <span>
                                            高橋 健（営業部）
                                        </span>

                                    </label>

                                </div>

                            </div>

                        </div>

                        <!-- =========================
                             フォーム操作
                        ========================== -->

                        <div class="groups-form-actions">

                            <a
                                href="org-chart.html"
                                class="btn btn-outline-secondary"
                            >
                                キャンセル
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                <i class="bi bi-plus-lg"></i>

                                部門を追加

                            </button>

                        </div>

                    </form>

                </section>

            </div>

        </main>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
