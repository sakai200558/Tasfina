
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ガントチャート | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- ガントチャート専用CSS -->
    <link rel="stylesheet" href="../css/gantt.css">

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- ガントチャート専用JavaScript -->
    <script src="../js/gantt.js" defer></script>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <!-- メインコンテンツ -->
        <main class="main-content gantt-page">

            <!-- タイトル -->
            <h1 class="gantt-title">
                ガントチャート
            </h1>

            <!-- 期間表示 -->
            <section class="gantt-toolbar">

                <div class="gantt-month-control">

                    <!-- 前週 -->
                    <button
                        type="button"
                        id="prevPeriod"
                        aria-label="前週"
                    >
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <!-- 現在表示している期間 -->
                    <span id="currentPeriod"></span>

                    <!-- 翌週 -->
                    <button
                        type="button"
                        id="nextPeriod"
                        aria-label="翌週"
                    >
                        <i class="bi bi-chevron-right"></i>
                    </button>

                </div>

            </section>

            <!-- ガントチャート -->
            <section
                class="gantt-chart-section"
                aria-label="タスクの週間スケジュール"
            >

                <div class="gantt-scroll">

                    <div
                        id="ganttChart"
                        class="gantt-chart"
                    ></div>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
