<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ガントチャート | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- ガントチャートCSS -->
    <link rel="stylesheet" href="../css/gantt.css">

    <!-- タスク詳細モーダルCSS -->
    <link
        rel="stylesheet"
        href="../css/gantt-task-detail.css"
    >

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- ガントチャートJavaScript -->
    <script src="../js/gantt.js" defer></script>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <!-- メインコンテンツ -->
        <main class="main-content gantt-page">

            <div class="gantt-page-heading">

                <h1 class="gantt-title">
                    ガントチャート
                </h1>

                <p class="gantt-description">
                    タスクの開始日から終了日までを
                    週間スケジュールで確認できます。
                </p>

            </div>

            <!-- 期間操作 -->
            <section class="gantt-toolbar">

                <div class="gantt-month-control">

                    <button
                        type="button"
                        id="prevPeriod"
                        aria-label="前週"
                    >
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <span id="currentPeriod"></span>

                    <button
                        type="button"
                        id="nextPeriod"
                        aria-label="翌週"
                    >
                        <i class="bi bi-chevron-right"></i>
                    </button>

                </div>

                <button
                    type="button"
                    id="todayButton"
                    class="btn btn-outline-primary gantt-today-button"
                >
                    <i class="bi bi-calendar-event"></i>
                    今週
                </button>

            </section>

            <!-- 表示情報 -->
            <div class="gantt-status-area">

                <span id="ganttTaskCount">
                    タスクを読み込み中...
                </span>

                <span
                    id="ganttLoading"
                    class="gantt-loading"
                    role="status"
                    aria-live="polite"
                ></span>

            </div>

            <!-- タスク色分け凡例 -->
            <div
                class="gantt-legend"
                aria-label="タスクの色分け"
            >

                <!-- 完了済み -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-completed"
                    >
                        <i class="bi bi-check-lg"></i>
                    </span>

                    <span>完了済み</span>

                </div>

                <!-- 自分の未完了タスク -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-mine"
                    ></span>

                    <span>自分の未完了タスク</span>

                </div>

                <!-- 他の人の未完了タスク -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-other"
                    ></span>

                    <span>その他の未完了タスク</span>

                </div>

            </div>

            <!-- エラー -->
            <div
                id="ganttError"
                class="alert alert-danger gantt-error"
                role="alert"
                hidden
            ></div>

            <!-- ガントチャート -->
            <section
                class="gantt-chart-section"
                aria-label="タスクの週間スケジュール"
            >

                <div class="gantt-scroll">

                    <div
                        id="ganttChart"
                        class="gantt-chart"
                    ></div>

                </div>

            </section>

        </main>

    </div>

    <!-- タスク詳細モーダルの読み込み先 -->
    <div id="ganttTaskDetailContainer"></div>

</body>

</html>
