
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ガントチャート | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- ガントチャート専用CSS -->
    <link rel="stylesheet" href="../css/gantt.css">

    <!-- 完了申請モーダルCSS -->
    <link rel="stylesheet" href="../css/gantt-modals.css">

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- ガントチャートJavaScript -->
    <script src="../js/gantt.js" defer></script>

    <!-- モーダルJavaScript -->
    <script src="../js/gantt-modals.js" defer></script>
</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <main class="main-content gantt-page">

            <h1 class="gantt-title">
                ガントチャート
            </h1>

            <!-- 期間操作 -->
            <section class="gantt-toolbar">

                <div class="gantt-toolbar-left">

                    <!-- 表示単位 -->
                    <div
                        class="gantt-view-switch"
                        role="group"
                        aria-label="表示単位"
                    >

                        <button
                            type="button"
                            data-view="day"
                        >
                            日
                        </button>

                        <button
                            type="button"
                            data-view="week"
                            class="active"
                        >
                            週
                        </button>

                        <button
                            type="button"
                            data-view="month"
                        >
                            月
                        </button>

                    </div>

                    <!-- 期間移動 -->
                    <div class="gantt-month-control">

                        <button
                            type="button"
                            id="prevPeriod"
                            aria-label="前の期間"
                        >
                            <i class="bi bi-chevron-left"></i>
                        </button>

                        <span id="currentPeriod"></span>

                        <button
                            type="button"
                            id="nextPeriod"
                            aria-label="次の期間"
                        >
                            <i class="bi bi-chevron-right"></i>
                        </button>

                    </div>

                    <!-- 今日 -->
                    <button
                        type="button"
                        id="todayButton"
                        class="gantt-icon-button"
                        aria-label="今日へ移動"
                        title="今日へ移動"
                    >
                        <i class="bi bi-calendar3"></i>
                    </button>

                </div>

            </section>

            <!-- ガントチャート -->
            <section
                class="gantt-chart-section"
                aria-label="タスクの期間一覧"
            >

                <div class="gantt-scroll">

                    <div
                        id="ganttChart"
                        class="gantt-chart"
                    ></div>

                </div>

            </section>

            <!-- 説明 -->
            <div class="gantt-legend">
                <span>
                    <i class="legend-color period"></i>
                    タスクの実施期間
                </span>
            </div>

            <!-- 選択中のタスク -->
            <section class="gantt-detail">

                <h2>選択中のタスク</h2>

                <div id="taskDetail">
                    <p class="gantt-empty">
                        タスクを選択してください。
                    </p>
                </div>

            </section>

        </main>

    </div>

    <!-- モーダルHTML配置先 -->
    <div id="ganttModals"></div>

</body>
</html>
