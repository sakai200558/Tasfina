<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ガントチャート | Tasfina</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link
        rel="stylesheet"
        href="../css/common.css"
    >

    <!-- ガントチャートCSS -->
    <link
        rel="stylesheet"
        href="../css/gantt.css"
    >

    <!-- タスク詳細モーダルCSS -->
    <link
        rel="stylesheet"
        href="../css/gantt-task-detail.css"
    >

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <!-- 共通JavaScript -->
    <script
        src="../js/common.js"
        defer
    ></script>

    <!-- ガントチャートJavaScript -->
    <script
        src="../js/gantt.js"
        defer
    ></script>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドバー -->
        <div id="sidebar"></div>

        <!-- メインコンテンツ -->
        <main class="main-content gantt-page">

            <!-- ========================================
                 ページ見出し
            ========================================= -->

            <div class="gantt-page-heading">

                <h1 class="gantt-title">
                    ガントチャート
                </h1>

                <p class="gantt-description">
                    タスクの開始日から終了日までを
                    週間スケジュールで確認できます。
                </p>

            </div>


            <!-- ========================================
                 期間操作
            ========================================= -->

            <section
                class="gantt-toolbar"
                aria-label="表示期間の変更"
            >

                <div class="gantt-month-control">

                    <!-- 前週 -->
                    <button
                        type="button"
                        id="prevPeriod"
                        aria-label="前週"
                    >

                        <i class="bi bi-chevron-left"></i>

                    </button>


                    <!-- 現在の表示期間 -->
                    <span id="currentPeriod"></span>


                    <!-- 翌週 -->
                    <button
                        type="button"
                        id="nextPeriod"
                        aria-label="翌週"
                    >

                        <i class="bi bi-chevron-right"></i>

                    </button>

                </div>


                <!-- 今週へ移動 -->
                <button
                    type="button"
                    id="todayButton"
                    class="btn btn-outline-primary gantt-today-button"
                >

                    <i class="bi bi-calendar-event"></i>

                    今週

                </button>

            </section>


            <!-- ========================================
                 タスク絞り込み
            ========================================= -->

            <section
                class="gantt-filter-area"
                aria-label="タスクの絞り込み"
            >

                <!-- 絞り込み見出し -->
                <div class="gantt-filter-heading">

                    <i
                        class="bi bi-funnel"
                        aria-hidden="true"
                    ></i>

                    <h2>
                        タスクの絞り込み
                    </h2>

                </div>


                <!-- フィルター操作 -->
                <div class="gantt-filter-controls">

                    <!-- ========================================
                         担当者フィルター
                    ========================================= -->

                    <div class="gantt-filter-group">

                        <label for="assigneeFilter">

                            <i
                                class="bi bi-person"
                                aria-hidden="true"
                            ></i>

                            担当者

                        </label>

                        <select
                            class="form-select gantt-filter-select"
                            id="assigneeFilter"
                        >

                            <!-- 全員 -->
                            <option value="all" selected>
                                すべての担当者
                            </option>


                            <!-- 自分のみ -->
                            <option value="mine">
                                自分のタスクのみ
                            </option>


                            <!-- 他人のみ -->
                            <option value="others">
                                他の人のタスクのみ
                            </option>


                            <!-- 担当者未設定 -->
                            <option value="unassigned">
                                担当者未設定
                            </option>


                            <!--
                                特定の担当者一覧

                                api_users.phpから取得した
                                ユーザーをJavaScriptで追加する
                            -->
                            <optgroup
                                label="特定の担当者"
                                id="assigneeUserOptions"
                            ></optgroup>

                        </select>

                    </div>


                    <!-- ========================================
                         タスク状態フィルター
                    ========================================= -->

                    <div class="gantt-filter-group">

                        <label for="statusFilter">

                            <i
                                class="bi bi-list-check"
                                aria-hidden="true"
                            ></i>

                            タスクの状態

                        </label>

                        <select
                            class="form-select gantt-filter-select"
                            id="statusFilter"
                        >

                            <!-- すべて -->
                            <option value="all" selected>
                                すべての状態
                            </option>


                            <!-- 未完了のみ -->
                            <option value="incomplete">
                                未完了のみ
                            </option>


                            <!-- 完了済みのみ -->
                            <option value="completed">
                                完了済みのみ
                            </option>

                        </select>

                    </div>


                    <!-- ========================================
                         絞り込み解除ボタン
                    ========================================= -->

                    <div class="gantt-filter-actions">

                        <button
                            type="button"
                            class="btn btn-outline-secondary gantt-filter-reset"
                            id="resetFiltersButton"
                        >

                            <i
                                class="bi bi-arrow-counterclockwise"
                                aria-hidden="true"
                            ></i>

                            絞り込み解除

                        </button>

                    </div>

                </div>


                <!-- フィルター補足説明 -->
                <p class="gantt-filter-help">

                    担当者とタスクの状態を組み合わせて
                    表示するタスクを絞り込めます。

                </p>


                <!-- 担当者取得エラーなどの表示 -->
                <p
                    class="gantt-filter-message"
                    id="ganttFilterMessage"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>

            </section>


            <!-- ========================================
                 タスク件数・読み込み表示
            ========================================= -->

            <div class="gantt-status-area">

                <span
                    id="ganttTaskCount"
                    aria-live="polite"
                >

                    タスクを読み込み中...

                </span>

                <span
                    id="ganttLoading"
                    class="gantt-loading"
                    role="status"
                    aria-live="polite"
                ></span>

            </div>


            <!-- ========================================
                 タスク色分け凡例
            ========================================= -->

            <div
                class="gantt-legend"
                aria-label="タスクの色分け"
            >

                <!-- 完了済み -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-completed"
                    >

                        <i class="bi bi-check-lg"></i>

                    </span>

                    <span>
                        完了済み
                    </span>

                </div>


                <!-- 自分の未完了タスク -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-mine"
                    ></span>

                    <span>
                        自分の未完了タスク
                    </span>

                </div>


                <!-- 他の人の未完了タスク -->
                <div class="gantt-legend-item">

                    <span
                        class="gantt-legend-color legend-other"
                    ></span>

                    <span>
                        その他の未完了タスク
                    </span>

                </div>

            </div>


            <!-- ========================================
                 エラー表示
            ========================================= -->

            <div
                id="ganttError"
                class="alert alert-danger gantt-error"
                role="alert"
                hidden
            ></div>


            <!-- ========================================
                 ガントチャート
            ========================================= -->

            <section
                class="gantt-chart-section"
                aria-label="タスクの週間スケジュール"
            >

                <div class="gantt-scroll">

                    <div
                        id="ganttChart"
                        class="gantt-chart"
                    ></div>

                </div>

            </section>

        </main>

    </div>


    <!-- ========================================
         タスク詳細モーダルの読み込み先
    ========================================= -->

    <div id="ganttTaskDetailContainer"></div>

</body>

</html>
