 
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>チャット | Tasfina</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- チャット専用CSS -->
    <link rel="stylesheet" href="../css/chat.css">

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- チャット専用JavaScript -->
    <script src="../js/chat.js" defer></script>

</head>

<body class="chat-page">

    <!-- 共通ヘッダー -->
    <div id="header"></div>

    <div class="app-layout">

        <!-- 共通サイドメニュー -->
        <div id="sidebar"></div>

        <main class="main-content chat-main">

            <div class="chat-layout">

                <!-- =========================
                     チャット一覧
                ========================= -->

                <section class="chat-list-panel">

                    <div class="chat-list-header">

                        <h1>チャット</h1>

                        <button
                            type="button"
                            id="newChatButton"
                            class="btn btn-primary new-chat-button"
                            data-bs-toggle="modal"
                            data-bs-target="#newChatModal"
                            disabled
                        >
                            <i class="bi bi-plus-lg"></i>
                            新しいチャット
                        </button>

                        <div class="chat-search">

                            <i class="bi bi-search"></i>

                            <input
                                type="search"
                                id="chatSearch"
                                placeholder="チャットを検索"
                                aria-label="チャットを検索"
                            >

                        </div>

                    </div>

                    <div id="chatList" class="chat-list">

                        <div class="chat-empty-state">
                            チャットを読み込んでいます...
                        </div>

                    </div>

                </section>

                <!-- =========================
                     メッセージ画面
                ========================= -->

                <section class="chat-conversation-panel">

                    <!-- チャット上部 -->

                    <div class="conversation-header">

                        <div class="conversation-title-area">

                            <div class="chat-avatar">

                                <i
                                    id="conversationIcon"
                                    class="bi bi-person-fill"
                                ></i>

                            </div>

                            <div>

                                <h2 id="conversationName">
                                    チャットを選択してください
                                </h2>

                                <p id="conversationMembers">
                                    メッセージを送信する相手を選択
                                </p>

                            </div>

                        </div>

                        <div class="conversation-actions">

                            <button
                                type="button"
                                id="messageSearchButton"
                                class="icon-button"
                                aria-label="メッセージ検索"
                                disabled
                            >
                                <i class="bi bi-search"></i>
                            </button>

                            <button
                                type="button"
                                id="chatMenuButton"
                                class="icon-button"
                                aria-label="その他"
                                disabled
                            >
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>

                        </div>

                    </div>

                    <!-- メッセージ検索 -->

                    <div
                        id="messageSearchArea"
                        class="message-search-area"
                        hidden
                    >

                        <input
                            type="search"
                            id="messageSearchInput"
                            class="form-control"
                            placeholder="メッセージを検索"
                            aria-label="メッセージを検索"
                        >

                        <button
                            type="button"
                            id="closeMessageSearchButton"
                            class="btn btn-outline-secondary"
                            aria-label="検索を閉じる"
                        >
                            <i class="bi bi-x-lg"></i>
                        </button>

                    </div>

                    <!-- エラーメッセージ -->

                    <div
                        id="chatError"
                        class="alert alert-danger chat-error"
                        role="alert"
                        hidden
                    ></div>

                    <!-- メッセージ一覧 -->

                    <div
                        id="messageList"
                        class="message-list"
                        aria-live="polite"
                    >

                        <div class="chat-empty-state">

                            <i class="bi bi-chat-dots"></i>

                            <p>
                                チャットを選択するか、<br>
                                新しいチャットを作成してください。
                            </p>

                        </div>

                    </div>

                    <!-- 添付ファイル確認欄 -->

                    <div
                        id="attachmentPreview"
                        class="attachment-preview"
                        hidden
                    >

                        <div class="attachment-preview-info">

                            <i class="bi bi-paperclip"></i>

                            <div>

                                <div id="attachmentFileName"></div>

                                <small id="attachmentFileSize"></small>

                            </div>

                        </div>

                        <button
                            type="button"
                            id="removeAttachmentButton"
                            class="btn btn-outline-danger btn-sm"
                            aria-label="添付ファイルを削除"
                        >
                            <i class="bi bi-x-lg"></i>
                        </button>

                    </div>

                    <!-- メッセージ入力 -->

                    <form id="messageForm" class="message-form">

                        <div class="message-tools">

                            <button
                                type="button"
                                id="attachButton"
                                aria-label="ファイル添付"
                                title="ファイル添付"
                                disabled
                            >
                                <i class="bi bi-paperclip"></i>
                            </button>

                            <button
                                type="button"
                                id="imageButton"
                                aria-label="画像添付"
                                title="画像添付"
                                disabled
                            >
                                <i class="bi bi-image"></i>
                            </button>

                            <button
                                type="button"
                                id="emojiButton"
                                aria-label="絵文字入力"
                                title="絵文字入力"
                                disabled
                            >
                                <i class="bi bi-emoji-smile"></i>
                            </button>

                        </div>

                        <input
                            type="text"
                            id="messageInput"
                            placeholder="メッセージを入力してください..."
                            autocomplete="off"
                            maxlength="5000"
                            aria-label="メッセージ"
                            disabled
                        >

                        <button
                            type="submit"
                            id="sendMessageButton"
                            class="send-button"
                            aria-label="送信"
                            disabled
                        >
                            <i class="bi bi-send-fill"></i>
                        </button>

                    </form>

                    <!-- ファイル選択 -->

                    <input
                        type="file"
                        id="chatFileInput"
                        class="visually-hidden"
                    >

                    <!-- 画像選択 -->

                    <input
                        type="file"
                        id="chatImageInput"
                        class="visually-hidden"
                        accept="image/jpeg,image/png,image/gif,image/webp"
                    >

                </section>

                <!-- =========================
                     チャット情報
                ========================= -->

                <aside class="chat-info-panel">

                    <div class="chat-info-heading">

                        <h2>チャット情報</h2>

                        <button
                            type="button"
                            class="btn btn-outline-primary btn-sm"
                            id="editChatButton"
                            disabled
                        >
                            <i class="bi bi-pencil"></i>
                            編集
                        </button>

                    </div>

                    <!-- 基本情報 -->

                    <div class="chat-group-info">

                        <div class="chat-avatar large">

                            <i
                                id="infoChatIcon"
                                class="bi bi-person-fill"
                            ></i>

                        </div>

                        <h3 id="infoChatName">
                            未選択
                        </h3>

                        <p id="infoMemberCount">
                            メンバー 0名
                        </p>

                    </div>

                    <!-- 説明 -->

                    <div class="chat-info-section">

                        <h3>説明</h3>

                        <p id="chatDescription">
                            チャットを選択してください。
                        </p>

                    </div>

                    <!-- メンバー -->

                    <div class="chat-info-section">

                        <div class="section-heading">

                            <h3 id="memberSectionTitle">
                                メンバー（0名）
                            </h3>

                            <button
                                type="button"
                                id="addMemberButton"
                                class="btn btn-outline-primary btn-sm"
                                disabled
                            >
                                <i class="bi bi-plus-lg"></i>
                                追加
                            </button>

                        </div>

                        <div id="chatMembers"></div>

                        <button
                            type="button"
                            id="showAllMembers"
                            class="text-action"
                            hidden
                        >
                            全メンバーを表示
                            <i class="bi bi-chevron-down"></i>
                        </button>

                    </div>

                    <!-- 共有ファイル -->

                    <div class="chat-info-section">

                        <div class="section-heading">

                            <h3>共有ファイル</h3>

                            <button
                                type="button"
                                id="showAllFiles"
                                class="text-action"
                                hidden
                            >
                                すべて見る
                                <i class="bi bi-arrow-right"></i>
                            </button>

                        </div>

                        <div id="sharedFiles">

                            <p class="text-muted">
                                共有ファイルはありません。
                            </p>

                        </div>

                    </div>

                </aside>

            </div>

        </main>

    </div>

    <!-- =========================
         新しいチャット作成モーダル
    ========================= -->

    <div
        class="modal fade"
        id="newChatModal"
        tabindex="-1"
        aria-labelledby="newChatModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">

            <div class="modal-content">

                <form id="newChatForm">

                    <div class="modal-header">

                        <h2
                            class="modal-title fs-5"
                            id="newChatModalLabel"
                        >
                            新しいチャット
                        </h2>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <!-- チャット種別 -->

                        <div class="mb-3">

                            <label class="form-label">
                                チャット種別
                            </label>

                            <div class="chat-type-options">

                                <div class="form-check">

                                    <input
                                        type="radio"
                                        class="form-check-input"
                                        name="chatType"
                                        id="directChatType"
                                        value="direct"
                                        checked
                                    >

                                    <label
                                        class="form-check-label"
                                        for="directChatType"
                                    >
                                        <i class="bi bi-person-fill"></i>
                                        個人チャット
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        type="radio"
                                        class="form-check-input"
                                        name="chatType"
                                        id="groupChatType"
                                        value="group"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="groupChatType"
                                    >
                                        <i class="bi bi-people-fill"></i>
                                        グループチャット
                                    </label>

                                </div>

                            </div>

                        </div>

                        <!-- グループチャット名 -->

                        <div id="groupChatFields" hidden>

                            <div class="mb-3">

                                <label
                                    for="newChatName"
                                    class="form-label"
                                >
                                    グループ名
                                </label>

                                <input
                                    type="text"
                                    id="newChatName"
                                    class="form-control"
                                    maxlength="50"
                                    placeholder="グループ名を入力"
                                    disabled
                                >

                            </div>

                            <div class="mb-3">

                                <label
                                    for="newChatDescription"
                                    class="form-label"
                                >
                                    説明
                                </label>

                                <textarea
                                    id="newChatDescription"
                                    class="form-control"
                                    rows="3"
                                    maxlength="500"
                                    placeholder="グループの説明を入力"
                                    disabled
                                ></textarea>

                            </div>

                        </div>

                        <!-- ユーザー選択 -->

                        <div class="mb-3">

                            <label
                                for="newChatUserSearch"
                                class="form-label"
                            >
                                メンバーを選択
                            </label>

                            <input
                                type="search"
                                id="newChatUserSearch"
                                class="form-control mb-2"
                                placeholder="ユーザー名で検索"
                            >

                            <div
                                id="newChatUserList"
                                class="chat-user-list"
                            >

                                <p class="text-muted">
                                    ユーザーを読み込んでいます...
                                </p>

                            </div>

                            <p
                                id="selectedMemberCount"
                                class="selected-member-count"
                            >
                                選択中：0名
                            </p>

                        </div>

                        <div
                            id="newChatError"
                            class="alert alert-danger"
                            role="alert"
                            hidden
                        ></div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            キャンセル
                        </button>

                        <button
                            type="submit"
                            id="createChatButton"
                            class="btn btn-primary"
                            disabled
                        >
                            作成
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- =========================
         チャット情報編集モーダル
    ========================= -->

    <div
        class="modal fade"
        id="editChatModal"
        tabindex="-1"
        aria-labelledby="editChatModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <form id="editChatForm">

                    <div class="modal-header">

                        <h2
                            class="modal-title fs-5"
                            id="editChatModalLabel"
                        >
                            チャット情報編集
                        </h2>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <div class="mb-3">

                            <label
                                for="editChatName"
                                class="form-label"
                            >
                                グループ名
                            </label>

                            <input
                                type="text"
                                id="editChatName"
                                class="form-control"
                                maxlength="50"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="editChatDescription"
                                class="form-label"
                            >
                                説明
                            </label>

                            <textarea
                                id="editChatDescription"
                                class="form-control"
                                rows="3"
                                maxlength="500"
                            ></textarea>

                        </div>

                        <div
                            id="editChatError"
                            class="alert alert-danger"
                            role="alert"
                            hidden
                        ></div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            キャンセル
                        </button>

                        <button
                            type="submit"
                            id="saveChatInfoButton"
                            class="btn btn-primary"
                        >
                            保存
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- =========================
         メンバー追加モーダル
    ========================= -->

    <div
        class="modal fade"
        id="addMemberModal"
        tabindex="-1"
        aria-labelledby="addMemberModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">

            <div class="modal-content">

                <form id="addMemberForm">

                    <div class="modal-header">

                        <h2
                            class="modal-title fs-5"
                            id="addMemberModalLabel"
                        >
                            メンバー追加
                        </h2>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="閉じる"
                        ></button>

                    </div>

                    <div class="modal-body">

                        <input
                            type="search"
                            id="addMemberSearch"
                            class="form-control mb-3"
                            placeholder="ユーザー名で検索"
                            aria-label="追加するユーザーを検索"
                        >

                        <div
                            id="addMemberUserList"
                            class="chat-user-list"
                        ></div>

                        <div
                            id="addMemberError"
                            class="alert alert-danger mt-3"
                            role="alert"
                            hidden
                        ></div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            キャンセル
                        </button>

                        <button
                            type="submit"
                            id="confirmAddMemberButton"
                            class="btn btn-primary"
                        >
                            追加
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- =========================
         画像拡大表示モーダル
    ========================= -->

    <div
        class="modal fade"
        id="imagePreviewModal"
        tabindex="-1"
        aria-labelledby="imagePreviewModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="imagePreviewModalLabel"
                    >
                        画像プレビュー
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="閉じる"
                    ></button>

                </div>

                <div class="modal-body image-preview-body">

                    <img
                        id="previewImage"
                        class="chat-preview-image"
                        alt="添付画像"
                    >

                </div>

            </div>

        </div>

    </div>

</body>

</html>
