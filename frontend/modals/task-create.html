<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>新規タスク作成 | Tasfina</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/task-create.css"><script src="../js/common.js" defer></script><script src="../js/task-create.js" defer></script></head>
<body class="app-page"><div id="header"></div><div class="app-layout"><div id="sidebar"></div><main class="page-main">
<div class="page-heading"><div><p class="eyebrow">TASK MANAGEMENT</p><h1>新規タスク作成</h1><p class="page-description">必要な情報を入力してタスクを作成します。</p></div><a class="btn btn-outline-secondary" href="tasks.html"><i class="bi bi-arrow-left"></i> 一覧へ戻る</a></div>
<section class="form-panel"><form id="taskCreateForm" novalidate>
<div class="form-section-title"><span class="section-number">01</span><div><h2>基本情報</h2><p>タスクの名前や概要を入力してください。</p></div></div>
<div class="field-group"><label for="taskTitle">タスク名 <span class="required">必須</span></label><input class="form-control" id="taskTitle" name="title" required maxlength="100" placeholder="例：ログイン機能の開発"><div class="field-error" id="titleError"></div></div>
<div class="field-group"><label for="taskDescription">タスクの説明</label><textarea class="form-control" id="taskDescription" name="description" rows="4" placeholder="タスクの目的や作業内容を入力してください。"></textarea></div>
<div class="field-row"><div class="field-group"><label for="assignee">担当者 <span class="required">必須</span></label><select class="form-select" id="assignee" name="assignee" required><option value="">担当者を選択</option><option>田中 龍之介</option><option>佐藤 花子</option><option>鈴木 一郎</option></select></div><div class="field-group"><label for="priority">優先度</label><select class="form-select" id="priority" name="priority"><option>中</option><option>高</option><option>低</option></select></div></div>
<div class="form-section-title second-section"><span class="section-number">02</span><div><h2>スケジュール</h2><p>開始日と期限を設定してください。</p></div></div>
<div class="field-row"><div class="field-group"><label for="startDate">開始日 <span class="required">必須</span></label><input class="form-control" type="date" id="startDate" name="startDate" required></div><div class="field-group"><label for="dueDate">期限 <span class="required">必須</span></label><input class="form-control" type="date" id="dueDate" name="dueDate" required></div></div>
<div class="form-actions"><a href="tasks.html" class="btn btn-light">キャンセル</a><button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> タスクを作成</button></div><p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
</form></section></main></div><div id="toastArea" class="toast-area" aria-live="polite"></div></body></html>
